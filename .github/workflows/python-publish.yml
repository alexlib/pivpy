# This workflow will build and upload the Python package when a release is created

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: '3.13'

    - name: Install build tools
      run: uv pip install tomli-w

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        # Remove 'v' prefix if present (e.g., v1.0.0 -> 1.0.0)
        VERSION=${VERSION#v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Update version in pyproject.toml
      run: |
        uv run python -c "
        import tomllib
        import tomli_w
        import sys
        
        try:
            # Read pyproject.toml
            with open('pyproject.toml', 'rb') as f:
                data = tomllib.load(f)
            
            # Update version
            version = '${{ steps.get_version.outputs.VERSION }}'
            if 'project' not in data:
                print('Error: [project] section not found in pyproject.toml', file=sys.stderr)
                sys.exit(1)
            
            data['project']['version'] = version
            print(f'Updated version to: {version}')
            
            # Write back
            with open('pyproject.toml', 'wb') as f:
                tomli_w.dump(data, f)
        except Exception as e:
            print(f'Error updating version: {e}', file=sys.stderr)
            sys.exit(1)
        "

    - name: Build package
      run: uv build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_TOKEN }}
