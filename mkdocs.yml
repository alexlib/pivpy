site_name: PIVPy
site_description: Post-processing of Particle Image Velocimetry (PIV) data
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://alexlib.github.io/pivpy/"]
repo_url: https://github.com/alexlib/pivpy
repo_name: alexlib/pivpy

docs_dir: docs_mkdocs

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
    - navigation.sections
    - navigation.expand

nav:
  - Home: index.md
  - Introduction: intro.md
  - Feature Gallery: gallery.md
  - Data model: pivpy_data_model.md
  - Visualization: pivpy_visualization.md
  - Notebook: notebook.md
  - Interactive tutorial: tutorial.md
  - Explore: explore.md
  - Written tutorial: pivpy_tutorial.md
  - FAQ: pivpy_faq.md
  - TKE budget: tke_budget.md
  - Convergence analysis: convergence_analysis.md
  - Vortex identification: vortex_identification.md
  - FFT spectra (2D): fft_spectrum_2d.md
  - Stress and TKE variants: stress_tke_variants.md
  - Anisotropy: anisotropy.md
  - API Reference: api_reference.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
  - marimo: {}

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
